version: "3.1"

rules:
  - rule: Greet the user
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye to the user
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Make a diagnosis
    steps:
      - intent: faire_diagnostic
      - action: action_predict_disease

  - rule: Handle other queries
    steps:
      - intent: autre
      - action: utter_more_help
